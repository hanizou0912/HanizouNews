name: Generate Daily Signal

on:
  schedule:
    - cron: "23 21 * * *"  # 毎日 JST 6:23 に実行（ピーク回避）
  workflow_dispatch:
    inputs:
      target_edition:
        description: "生成する版 (both / work / life)"
        required: false
        default: "both"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate HTML and notify Discord
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_WORK: ${{ secrets.DISCORD_WEBHOOK_WORK }}
          DISCORD_WEBHOOK_LIFE: ${{ secrets.DISCORD_WEBHOOK_LIFE }}
          TARGET_EDITION: ${{ github.event.inputs.target_edition || 'both' }}
        run: python scripts/generate.py

      - name: Commit and push generated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Update daily signal"
          git push
