name: Generate Daily Signal

on:
  schedule:
    # 毎日 22:00 UTC = 翌朝 7:00 JST に実行
    - cron: "0 22 * * *"
  workflow_dispatch: # GitHub画面から手動でテスト実行するためのボタン

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate HTML and notify Discord
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_WORK: ${{ secrets.DISCORD_WEBHOOK_WORK }}
          DISCORD_WEBHOOK_LIFE: ${{ secrets.DISCORD_WEBHOOK_LIFE }}
          TARGET_EDITION: "both"
        run: python scripts/generate.py

      - name: Commit and push generated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Update daily signal"
          git push
